name: Build SwitchLive

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-switch:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install deps
      run: |
        apt-get update -qq
        apt-get install -y cmake ninja-build git

    - name: Clone borealis
      run: |
        mkdir -p library
        cd library
        git clone --recursive --depth 1 https://github.com/xfangfang/borealis.git

    - name: CMake Configure
      run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPLATFORM_SWITCH=ON

    - name: Build
      run: cmake --build build -j$(nproc)

    - name: Find NRO
      if: always()
      run: find . -name "*.nro" -o -name "*.elf" 2>/dev/null

    - name: Upload artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: SwitchLive
        path: "**/SwitchLive.nro"
        if-no-files-found: warn
