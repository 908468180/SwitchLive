name: Build SwitchLive

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-switch:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { driver: opengl }

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Clone borealis
      run: |
        mkdir -p library
        cd library
        git clone --recursive --depth 1 https://github.com/xfangfang/borealis.git

    - name: Pull Docker image
      run: |
        for i in 1 2 3; do
          docker pull devkitpro/devkita64:latest && break
          echo "Retry $i failed, waiting..."
          sleep 10
        done

    - name: Build Nro
      run: |
        docker run --rm -v $(pwd):/data devkitpro/devkita64:latest bash /data/scripts/build_switch.sh

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: SwitchLive-${{ matrix.driver }}
        path: "cmake-build-switch/*.nro"
        if-no-files-found: warn
