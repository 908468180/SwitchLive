name: Build SwitchLive

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-switch:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install host deps
      run: |
        apt-get update -qq
        apt-get install -y cmake ninja-build git

    - name: Clone borealis
      run: |
        mkdir -p library
        cd library
        git clone --depth 1 https://github.com/nickoala/borealis.git

    - name: Build
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_TOOLCHAIN_FILE=/opt/devkitpro/cmake/Switch.cmake
        cmake --build build -j$(nproc)

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: SwitchLive.nro
        path: build/SwitchLive.nro

  build-desktop:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install deps
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y cmake g++ libcurl4-openssl-dev nlohmann-json3-dev libglfw3-dev libgl-dev git

    - name: Clone borealis
      run: |
        mkdir -p library
        cd library
        git clone --depth 1 https://github.com/nickoala/borealis.git

    - name: Build
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build -j$(nproc)

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: SwitchLive-Linux
        path: build/SwitchLive
