name: Build SwitchLive

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-switch:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install deps
      run: |
        apt-get update -qq
        apt-get install -y cmake ninja-build git

    - name: Clone borealis
      run: |
        mkdir -p library
        cd library
        git clone --recursive --depth 1 https://github.com/xfangfang/borealis.git

    - name: CMake Configure
      run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPLATFORM_SWITCH=ON

    - name: Build
      run: cmake --build build -j$(nproc)

    - name: Package NRO
      if: success()
      run: |
        cd build
        nacptool --create SwitchLive "SwitchLive" "0.1.0" SwitchLive.nacp
        cp -r ../resources romfs
        elf2nro SwitchLive.elf SwitchLive.nro --nacp=SwitchLive.nacp --romfsdir=romfs
        ls -la SwitchLive.nro
        cd ..

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: SwitchLive
        path: build/SwitchLive.nro
        if-no-files-found: error
