name: Build SwitchLive

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-switch:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { driver: opengl }

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Build Nro
      run: |
        docker run --rm -v $(pwd):/data devkitpro/devkita64:20251117 bash /data/scripts/build_switch.sh

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: SwitchLive-${{ matrix.driver }}
        path: "cmake-build-switch/*.nro"
        if-no-files-found: warn
