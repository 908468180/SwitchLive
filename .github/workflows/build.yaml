name: Build SwitchLive

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-switch:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install deps
      run: |
        apt-get update -qq
        apt-get install -y cmake ninja-build git

    - name: Clone borealis
      run: |
        mkdir -p library
        cd library
        git clone --recursive --depth 1 https://github.com/xfangfang/borealis.git

    - name: Build
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DPLATFORM_SWITCH=ON 2>&1 | tee build_output.txt
        cmake --build build -j$(nproc) 2>&1 | tee -a build_output.txt
        cmake --build build --target SwitchLive.nro 2>&1 | tee -a build_output.txt
        ls -la build/SwitchLive.nro build/SwitchLive.elf 2>&1 | tee -a build_output.txt || true

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build_output.txt

    - name: Upload artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: SwitchLive
        path: build/SwitchLive.nro
