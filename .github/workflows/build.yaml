name: Build SwitchLive

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-switch:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install devkitPro
      run: |
        wget https://apt.devkitpro.org/install-devkitpro-pacman
        chmod +x install-devkitpro-pacman
        sudo ./install-devkitpro-pacman
        sudo dkp-pacman -S switch-dev switch-tools

    - name: Install deps
      run: sudo apt-get install -y libcurl4-openssl-dev nlohmann-json3-dev

    - name: Clone borealis
      run: |
        mkdir -p library
        cd library
        git clone --depth 1 https://github.com/nickoala/borealis.git

    - name: Build
      run: |
        mkdir -p build && cd build
        cmake .. -DPLATFORM_SWITCH=ON
        make -j$(nproc)

    - uses: actions/upload-artifact@v4
      with:
        name: SwitchLive.nro
        path: build/SwitchLive.nro

  build-desktop:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install deps
      run: |
        sudo apt-get update
        sudo apt-get install -y libcurl4-openssl-dev nlohmann-json3-dev libglfw3-dev libgl-dev cmake g++

    - name: Clone borealis
      run: |
        mkdir -p library
        cd library
        git clone --depth 1 https://github.com/nickoala/borealis.git

    - name: Build
      run: |
        mkdir -p build && cd build
        cmake ..
        make -j$(nproc)

    - uses: actions/upload-artifact@v4
      with:
        name: SwitchLive-Linux
        path: build/SwitchLive
