name: Build SwitchLive

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-switch:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install deps
      run: |
        apt-get update -qq
        apt-get install -y cmake ninja-build git

    - name: Clone borealis
      run: |
        mkdir -p library
        cd library
        git clone --recursive --depth 1 https://github.com/xfangfang/borealis.git

    - name: CMake Configure
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DPLATFORM_SWITCH=ON 2>&1 | tee cmake_output.txt

    - name: Build
      if: success()
      run: |
        cmake --build build -j$(nproc) 2>&1 | tee cmake_build.txt

    - name: Package NRO
      if: success()
      run: |
        cmake --build build --target SwitchLive.nro 2>&1 | tee cmake_nro.txt
        ls -la build/SwitchLive.elf build/SwitchLive.nro

    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          cmake_output.txt
          cmake_build.txt
          cmake_nro.txt

    - name: Upload artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: SwitchLive
        path: build/SwitchLive.nro
